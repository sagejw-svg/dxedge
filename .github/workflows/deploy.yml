name: Deploy DXEdge

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Stamp the Crane Cab build with the commit it was built from, so a player
      # can tell a cached copy from a fresh one by reading the title card instead
      # of diffing the gauges. Only the published mirror is touched, never
      # crane-cab-dev/, so the repo copy stays at 'dev' and never churns.
      # The sed patterns are guarded by a check in crane-cab-dev/test/regress.mjs;
      # if they stop matching, this step fails the deploy rather than shipping a
      # build that quietly claims to be 'dev'.
      - name: Stamp the Crane Cab build
        run: |
          set -euo pipefail
          F=frontend/public/crane-cab/data/build.js
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/sha: 'dev'/sha: '$SHA'/; s/date: ''/date: '$DATE'/" "$F"
          grep -q "sha: '$SHA'" "$F" || { echo "build stamp did not apply to $F"; exit 1; }
          grep -q "date: '$DATE'" "$F" || { echo "build date did not apply to $F"; exit 1; }
          echo "stamped $SHA $DATE"

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Detect what changed
        id: changes
        run: |
          # github.event.before is the commit main pointed at before this push.
          # Diffing HEAD~1..HEAD only inspects the LAST commit, so a push of
          # several commits could miss a backend change in an earlier one.
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          echo "Changed files: $CHANGED"
          if echo "$CHANGED" | grep -qE '^backend/|^nginx/|^docker-compose'; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

      - name: Copy built frontend to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/opt/dxedge/frontend/dist/"
          strip_components: 2

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_PASSWORD: ${{ secrets.NEWS_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: XAI_API_KEY,GROK_API_KEY,ANTHROPIC_API_KEY,NEWS_PASSWORD
          script: |
            set -e
            BACKEND_CHANGED="${{ steps.changes.outputs.backend }}"
            cd /opt/dxedge
            LOG=/var/log/dxedge_deploy.log
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] GitHub Actions deploy starting" >> $LOG
            # Forward a model key only when the Actions secret is actually set.
            # An empty value must not clobber a key already on the host.
            # A set value is stored in the droplet .env after reset, then removed
            # from this shell so nothing later can print it. The next deploy with
            # no secret leaves that file alone.
            KEY_SET=0
            if [ -n "${XAI_API_KEY:-}" ]; then
              KEY_SET=1
            else
              unset XAI_API_KEY
            fi
            if [ -n "${GROK_API_KEY:-}" ]; then
              KEY_SET=1
            else
              unset GROK_API_KEY
            fi
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              KEY_SET=1
            else
              unset ANTHROPIC_API_KEY
            fi
            if [ "$KEY_SET" = "1" ]; then
              echo "[$(date)] news model key is set for this deploy" >> $LOG
            else
              echo "[$(date)] news model key is unset; generation stays on the stub" >> $LOG
            fi
            # fetch + reset rather than pull: a pull needs the droplet's branch to
            # fast-forward, and it stopped doing that after main was rewritten on
            # Sep 7 2026 (author identity fix). Every deploy since exited 128 here,
            # before the nginx restart, the backend rebuild and the verify steps,
            # while the scp step above kept landing the frontend, so the site looked
            # fine and the runs were red. The droplet is a deploy target, not a
            # working copy: whatever origin/main is, is what it should be.
            git fetch origin main
            git reset --hard origin/main
            # Store a present secret without printing it. Refuse values that
            # would break a dotenv line. An absent secret does not touch the file.
            write_secret() {
              local name="$1"
              local value="$2"
              case "$value" in
                *[!A-Za-z0-9_.:+=/-]*)
                  echo "[$(date)] ERROR: $name has characters this deploy will not write. Droplet value left unchanged." >> $LOG
                  echo "ERROR: $name has characters this deploy will not write. Droplet value left unchanged."
                  exit 1
                  ;;
              esac
              umask 077
              local env_file=/opt/dxedge/.env
              local tmp
              tmp=$(mktemp)
              if [ -f "$env_file" ]; then
                grep -v -E "^(export )?${name}=" "$env_file" > "$tmp" || true
              fi
              printf '%s=%s\n' "$name" "$value" >> "$tmp"
              mv "$tmp" "$env_file"
              chmod 600 "$env_file"
            }
            if [ -n "${XAI_API_KEY:-}" ]; then
              write_secret XAI_API_KEY "$XAI_API_KEY"
              unset XAI_API_KEY
            fi
            if [ -n "${GROK_API_KEY:-}" ]; then
              write_secret GROK_API_KEY "$GROK_API_KEY"
              unset GROK_API_KEY
            fi
            ANTHROPIC_WRITTEN=0
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              write_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
              unset ANTHROPIC_API_KEY
              ANTHROPIC_WRITTEN=1
            fi
            # The paper password. Same rules as the model key: a set secret is
            # written, an empty one must not clobber a password already on the
            # host, and the value is removed from this shell before anything
            # can print it. Basic auth user is edge. If the secret is absent
            # and the droplet has no password yet, generate one and do not log
            # it. Fail closed: the app locks /news whenever NEWS_PASSWORD is
            # empty, so a missing secret cannot leave the paper open.
            NEWS_PW_WRITTEN=0
            if [ -n "${NEWS_PASSWORD:-}" ]; then
              write_secret NEWS_PASSWORD "$NEWS_PASSWORD"
              unset NEWS_PASSWORD
              NEWS_PW_WRITTEN=1
            else
              unset NEWS_PASSWORD
              if [ -f /opt/dxedge/.env ] && grep -qE '^(export )?NEWS_PASSWORD=.+' /opt/dxedge/.env; then
                echo "[$(date)] NEWS_PASSWORD secret unset; keeping the existing droplet password" >> $LOG
              else
                if ! generated=$(openssl rand -hex 24 2>/dev/null); then
                  generated=$(python3 -c 'import secrets; print(secrets.token_hex(24))')
                fi
                write_secret NEWS_PASSWORD "$generated"
                unset generated
                NEWS_PW_WRITTEN=1
                echo "[$(date)] NEWS_PASSWORD secret unset; generated a droplet password without logging it" >> $LOG
              fi
            fi
            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "[$(date)] Backend changed - rebuilding container" >> $LOG
              docker compose build backend
              docker compose up -d
            elif [ "$KEY_SET" = "1" ] || [ "$NEWS_PW_WRITTEN" = "1" ]; then
              echo "[$(date)] Backend env updated - recreating backend" >> $LOG
              docker compose up -d --force-recreate --no-deps backend
            else
              echo "[$(date)] Frontend-only - restarting nginx" >> $LOG
            fi
            # nginx.conf is a bind mount and nginx reads it once, at start.
            # `docker compose up -d` leaves a service whose definition has not
            # changed exactly where it is, so the backend branch above used to
            # deploy a new nginx.conf to disk and keep serving the old one -
            # which is why the cache headers on /sw.js stayed wrong through a
            # deploy that reported success. Restart it either way; it is cheap.
            docker compose restart nginx
            sleep 2
            docker compose exec -T nginx nginx -t >> $LOG 2>&1 || {
              echo "[$(date)] ERROR: nginx rejected its config" >> $LOG
              exit 1
            }
            # Verify the backend container actually restarted onto the new
            # image. Without this the deploy can "succeed" while the old
            # container keeps running, which is exactly what happened on
            # 2026-08-31: the frontend SCP lands before this SSH step, so a
            # stale backend serves a fresh frontend and nothing reports it.
            if [ "$BACKEND_CHANGED" = "true" ] || [ "$KEY_SET" = "1" ] || [ "$NEWS_PW_WRITTEN" = "1" ]; then
              sleep 10
              RUNNING_SINCE=$(docker inspect -f '{{.State.StartedAt}}' dxedge-backend)
              echo "[$(date)] backend container started at $RUNNING_SINCE" >> $LOG
              docker compose ps backend >> $LOG
              if ! docker compose ps backend | grep -qi 'up\|running'; then
                echo "[$(date)] ERROR: backend container is not running" >> $LOG
                exit 1
              fi
              # Ready flags only. The password and the model keys stay in the
              # container. news_status.py prints the provider line and nothing else.
              if ! NEWS_STATUS=$(docker compose exec -T backend python3 news_status.py); then
                echo "$NEWS_STATUS" >> $LOG
                echo "$NEWS_STATUS"
                echo "[$(date)] ERROR: news status check failed" >> $LOG
                exit 1
              fi
              echo "$NEWS_STATUS" >> $LOG
              echo "$NEWS_STATUS"
              if [ "$ANTHROPIC_WRITTEN" = "1" ]; then
                case "$NEWS_STATUS" in
                  *anthropic=True*) ;;
                  *)
                    echo "[$(date)] ERROR: ANTHROPIC_API_KEY was set but status does not show anthropic ready" >> $LOG
                    echo "ERROR: ANTHROPIC_API_KEY was set but status does not show anthropic ready"
                    exit 1
                    ;;
                esac
              fi
            fi

            # Certificate guard. Exits immediately unless the cert is expired or
            # within 30 days of it. Never fails the deploy: it always exits 0.
            bash scripts/cert_repair.sh || true
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Deploy complete: $(git rev-parse --short HEAD)" >> $LOG

      - name: Verify cache headers on the files that carry a deploy
        run: |
          sleep 3
          # /sw.js and the unhashed /crane-cab/ tree must never come back
          # immutable: those are the files a deploy has to be able to replace.
          # GET, not HEAD: these paths proxy to the backend, which answers 405
          # to HEAD, and a 405 carries no cache-control at all - the check would
          # pass by finding nothing.
          for U in https://dxedge.net/sw.js https://dxedge.net/crane-cab/js/main.js https://dxedge.net/news/ https://dxedge.net/delve/ https://dxedge.net/delve/engine.js; do
            CC=$(curl -s -D- -o /dev/null "$U" | tr -d '\r' | grep -i '^cache-control:' | tr '\n' ' ')
            if [ -z "$CC" ]; then
              echo "ERROR: $U returned no cache-control header at all."
              exit 1
            fi
            echo "$U -> $CC"
            if echo "$CC" | grep -qi 'immutable'; then
              echo "ERROR: $U is served immutable. Returning visitors will not"
              echo "see this deploy. nginx is running a stale config."
              exit 1
            fi
          done

      - name: Verify Delve is live
        run: |
          html=$(curl -sf https://dxedge.net/delve/)
          echo "$html" | grep -q 'Help (H)' || { echo "ERROR: /delve/ is not the current game"; exit 1; }
          echo "$html" | grep -q 'Quests (J)' || { echo "ERROR: /delve/ is missing the quest log"; exit 1; }
          echo "$html" | grep -q 'campfire' || { echo "ERROR: /delve/ is missing the waystation notes"; exit 1; }
          echo "$html" | grep -q 'character sheet' || { echo "ERROR: /delve/ is missing the character sheet"; exit 1; }
          echo "$html" | grep -q 'floor plate' || { echo "ERROR: /delve/ is missing the floor plate"; exit 1; }
          echo "$html" | grep -q "Nell's stall" || { echo "ERROR: /delve/ is missing the stall"; exit 1; }
          echo "$html" | grep -q 'Delve' || { echo "ERROR: /delve/ missing the title"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' https://dxedge.net/delve/engine.js)
          echo "/delve/engine.js $code"
          if [ "$code" != "200" ]; then
            echo "ERROR: /delve/engine.js is not 200"
            exit 1
          fi
          eng=$(curl -sf https://dxedge.net/delve/engine.js)
          echo "$eng" | grep -q 'function aheadLine' || { echo "ERROR: /delve/engine.js is not the chest-distance build"; exit 1; }

      - name: Verify feed proxy is live
        run: |
          sleep 5
          CODE=$(curl -s -o /tmp/feed.out -w '%{http_code}' \
            "https://dxedge.net/api/feed?url=https%3A%2F%2Fwww.rtl-sdr.com%2Ffeed%2F")
          echo "api/feed returned $CODE"
          # A stale backend has no /api/feed route, so the SPA catch-all answers
          # with index.html and a 200. Status alone cannot tell them apart.
          if head -c 60 /tmp/feed.out | grep -qi '<!DOCTYPE html'; then
            echo "ERROR: /api/feed fell through to the SPA catch-all."
            echo "The backend container is running stale code."
            exit 1
          fi

      - name: Verify health
        run: |
          sleep 8
          curl -sf https://dxedge.net/api/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'Health: {d[\"status\"]} | SFI={d[\"sfi\"]} | spots={d[\"spots\"]}')
          assert d['status'] == 'ok', 'Health check failed'
          "

      # The paper must stay locked for strangers. The homepage stays open.
      - name: Verify the paper is private
        run: |
          news=$(curl -s -o /dev/null -w '%{http_code}' https://dxedge.net/news/)
          status=$(curl -s -o /dev/null -w '%{http_code}' https://dxedge.net/api/news/status)
          home=$(curl -s -o /dev/null -w '%{http_code}' https://dxedge.net/)
          echo "/news/ $news"
          echo "/api/news/status $status"
          echo "/ $home"
          case "$news" in 401|403) ;; *) echo "ERROR: /news/ is not locked"; exit 1 ;; esac
          case "$status" in 401|403) ;; *) echo "ERROR: /api/news/status is not locked"; exit 1 ;; esac
          if [ "$home" != "200" ]; then
            echo "ERROR: homepage is not open"
            exit 1
          fi
