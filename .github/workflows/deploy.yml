name: Deploy DXEdge

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Detect what changed
        id: changes
        run: |
          # github.event.before is the commit main pointed at before this push.
          # Diffing HEAD~1..HEAD only inspects the LAST commit, so a push of
          # several commits could miss a backend change in an earlier one.
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          echo "Changed files: $CHANGED"
          if echo "$CHANGED" | grep -qE '^backend/|^nginx/|^docker-compose'; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

      - name: Copy built frontend to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/opt/dxedge/frontend/dist/"
          strip_components: 2

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            BACKEND_CHANGED="${{ steps.changes.outputs.backend }}"
            cd /opt/dxedge
            LOG=/var/log/dxedge_deploy.log
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] GitHub Actions deploy starting" >> $LOG
            git pull origin main
            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "[$(date)] Backend changed - rebuilding container" >> $LOG
              docker compose build backend
              docker compose up -d
            else
              echo "[$(date)] Frontend-only - restarting nginx" >> $LOG
              docker compose restart nginx
            fi
            # Verify the backend container actually restarted onto the new
            # image. Without this the deploy can "succeed" while the old
            # container keeps running, which is exactly what happened on
            # 2026-08-31: the frontend SCP lands before this SSH step, so a
            # stale backend serves a fresh frontend and nothing reports it.
            if [ "$BACKEND_CHANGED" = "true" ]; then
              sleep 10
              RUNNING_SINCE=$(docker inspect -f '{{.State.StartedAt}}' dxedge-backend)
              echo "[$(date)] backend container started at $RUNNING_SINCE" >> $LOG
              docker compose ps backend >> $LOG
              if ! docker compose ps backend | grep -qi 'up\|running'; then
                echo "[$(date)] ERROR: backend container is not running" >> $LOG
                exit 1
              fi
            fi

            # Certificate guard. Exits immediately unless the cert is expired or
            # within 30 days of it. Never fails the deploy: it always exits 0.
            bash scripts/cert_repair.sh || true
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Deploy complete: $(git rev-parse --short HEAD)" >> $LOG

      - name: Verify feed proxy is live
        run: |
          sleep 5
          CODE=$(curl -s -o /tmp/feed.out -w '%{http_code}' \
            "https://dxedge.net/api/feed?url=https%3A%2F%2Fwww.rtl-sdr.com%2Ffeed%2F")
          echo "api/feed returned $CODE"
          # A stale backend has no /api/feed route, so the SPA catch-all answers
          # with index.html and a 200. Status alone cannot tell them apart.
          if head -c 60 /tmp/feed.out | grep -qi '<!DOCTYPE html'; then
            echo "ERROR: /api/feed fell through to the SPA catch-all."
            echo "The backend container is running stale code."
            exit 1
          fi

      - name: Verify health
        run: |
          sleep 8
          curl -sf https://dxedge.net/api/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'Health: {d[\"status\"]} | SFI={d[\"sfi\"]} | spots={d[\"spots\"]}')
          assert d['status'] == 'ok', 'Health check failed'
          "
