events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    # The usage beacon gets its own budget. It fires on tab switches and on
    # pagehide, so an active session is chatty by design and must never eat
    # the API allowance that the dashboard itself needs.
    limit_req_zone $binary_remote_addr zone=stat:10m rate=120r/m;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name dxedge.net www.dxedge.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name dxedge.net www.dxedge.net;

        ssl_certificate     /etc/letsencrypt/live/dxedge.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dxedge.net/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        # Usage beacon. Exact match so it outranks the /api/ block below and
        # is metered against the stat zone instead of the API zone.
        location = /api/stat {
            limit_req zone=stat burst=20 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        # Shared libraries (propagation.js, stat.js) keep their filenames across
        # deploys, so the 1y immutable rule in the regex location below would
        # pin an old copy on every returning visitor for a year. Same reasoning
        # as the crane-cab carve-out. ^~ outranks the regex locations.
        location ^~ /lib/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, must-revalidate";
            expires -1;
        }

        # Section generation calls xAI with web search and may take
        # XAI_TIMEOUT_S (150s). This has to outlast the backend, and it
        # must not retry or a second attempt spends another model call.
        location /api/news {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_next_upstream off;
        }

        # API - proxy to FastAPI
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_next_upstream   error timeout http_502 http_503;
            proxy_next_upstream_tries   3;
            proxy_next_upstream_timeout 30s;
        }

        # LoTW can be slow - give it more time
        location /api/lotw {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        location /ws/ {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The service worker must never be cached. It is the file that carries
        # CACHE_NAME, so if a browser or any proxy in between holds an old copy,
        # the bump never arrives and every later deploy is invisible. An exact
        # (=) match outranks the regex locations below, which would otherwise
        # catch it as a .js file and pin it for a year.
        location = /sw.js {
            proxy_pass http://backend:8000;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # Crane Cab ships as plain ES modules with stable filenames (js/radio.js
        # and friends), so unlike the Vite bundle there is no content hash to
        # bust. Long caching here means a returning player keeps last month's
        # game forever. ^~ outranks the regex locations below.
        location ^~ /crane-cab/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, must-revalidate";
            expires -1;
        }

        # Filament (/synth/) ships plain ES modules and an AudioWorklet with stable
        # filenames (voice.worklet.js, rack.js, ...), so the 1y immutable rule below would
        # pin last month's engine on every returning player. Same reason as crane-cab.
        location ^~ /synth/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache, must-revalidate";
            expires -1;
        }

        # The Edge (/news/) is one stable index.html. Same reason as /synth/:
        # a year-long immutable cache would pin an old edition of the page.
        # The backend requires HTTP basic auth (user edge) before it serves
        # this path or /api/news/. `always` keeps Cache-Control on the 401,
        # which is the response a stranger gets. Without it, nginx would
        # omit the header on that status and a deploy would look stale.
        location = /news {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires -1;
        }

        location ^~ /news/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires -1;
        }

        # Frontend static files - served by FastAPI fallthrough
        location / {
            proxy_pass       http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Cache hashed JS/CSS assets forever. Only safe because Vite puts a
            # content hash in these filenames - anything unhashed is carved out
            # into its own location above.
            location ~* \.(js|css|woff2)$ {
                proxy_pass http://backend:8000;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
            # Cache static assets - shorter TTL for non-hashed files
            location ~* \.(png|svg|ico|json)$ {
                proxy_pass http://backend:8000;
                expires 7d;
                add_header Cache-Control "public, max-age=604800";
            }
        }
    }
}
