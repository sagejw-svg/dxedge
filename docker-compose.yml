services:
  backend:
    build: ./backend
    container_name: dxedge-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      # The newspaper calls xAI only when a section is opened. The deploy
      # workflow writes XAI_API_KEY or GROK_API_KEY into this directory's
      # .env when that Actions secret is set, and leaves an existing value
      # alone when it is not. With neither, the desk stays on the stub.
      # NEWS_OWNER_SEED is the private seed for one reader's votes. It is never
      # sent to the browser. NEWS_OWNER_READER is that reader's anonymous id.
      - XAI_API_KEY=${XAI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-4.7}
      - NEWS_OWNER_SEED=${NEWS_OWNER_SEED:-}
      - NEWS_OWNER_READER=${NEWS_OWNER_READER:-}
    expose:
      - "8000"
    volumes:
      - ./frontend/dist:/app/frontend/dist:ro
      - dxedge-data:/data
    networks:
      - dxedge
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: dxedge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dxedge

# The certbot sidecar that used to live here has been removed. It ran
# "certbot renew --webroot", but the renewal config written by bootstrap.sh
# recorded authenticator=standalone, and "certbot renew" reads the authenticator
# from that config and ignores the command line flag. So it tried to bind port
# 80, lost to nginx, and failed silently under --quiet for the life of the site.
# It also had no deploy hook, so nginx would have kept serving the old
# certificate from memory even on success. Renewal now runs from the host via
# /etc/cron.d/dxedge-certbot, installed by scripts/cert_repair.sh, using the
# same /var/www/certbot webroot nginx serves and restarting nginx afterwards.

volumes:
  dxedge-data:

networks:
  dxedge:
    driver: bridge
