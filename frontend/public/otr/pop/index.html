<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a110b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OTR Radio">
<meta name="description" content="A pocket radio for classic 1930s to 50s radio: the networks' real weekly lineups and genre channels, tuned on a tube set or a leather-cased portable.">
<link rel="manifest" href="/otr/pop/manifest.webmanifest">
<link rel="apple-touch-icon" href="/otr/pop/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/otr/pop/icon-192.png">
<title>Old Time Radio</title>
<style>
  :root{
    --wall:#1a110b; --lamp:#3d2617; --paper:#f1e6d0; --muted:#c3b192; --dim:#8e7d63; --amber:#f4b860; --red:#e0563a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:Futura,"Futura PT","Avenir Next","Century Gothic","Gill Sans",sans-serif;
  }
  *{box-sizing:border-box}
  html{height:100%;background:var(--wall)}
  body{margin:0;min-height:100%;color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;
    background:radial-gradient(70% 48% at 50% 30%,var(--lamp),var(--wall) 72%) fixed var(--wall);
    padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  a{color:var(--amber)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px}

  .room{display:grid;grid-template-columns:1fr;justify-items:center;gap:14px;max-width:1100px;margin:0 auto}
  .stage{position:relative}
  .fit{position:absolute;left:0;top:0;transform-origin:0 0}

  .log{width:100%;max-width:420px;text-align:center;padding:0 6px}
  .log-status{margin:0;font-size:13px;letter-spacing:.04em;color:var(--muted);min-height:1.4em}
  .log-status b{color:var(--paper);font-weight:600}
  .log-status .air{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--red);vertical-align:1px;box-shadow:0 0 8px var(--red)}
  .log-show{margin:6px 0 2px;font:500 26px/1.15 var(--serif);color:#fff6e4;text-wrap:balance}
  .log-ep{margin:0;font:italic 17px/1.35 var(--serif);color:var(--paper);text-wrap:balance}
  .log-meta{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
  .log-progress{display:flex;align-items:center;gap:10px;margin:12px auto 0;max-width:320px}
  .log-bar{flex:1;height:3px;border-radius:2px;background:rgba(241,230,208,.16);overflow:hidden}
  .log-bar i{display:block;height:100%;width:0;background:var(--amber)}
  .log-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}
  .log-next{margin:10px 0 0;font-size:13px;color:var(--dim)}
  .log-next b{color:var(--muted);font-weight:500}
  .log-actions{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{min-width:7.5em;padding:10px 18px;border-radius:22px;border:1px solid rgba(244,184,96,.45);background:rgba(244,184,96,.10);cursor:pointer;font-size:14px;letter-spacing:.03em}
  .btn:hover{background:rgba(244,184,96,.18)}
  .btn.quiet{border-color:rgba(241,230,208,.22);background:transparent;color:var(--muted)}
  .shift{margin:10px 0 0;font-size:13px;color:var(--amber)}

  .faces{display:flex;gap:8px;justify-content:center}
  .faces button{padding:7px 14px;border-radius:18px;border:1px solid rgba(241,230,208,.18);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
  .faces button[aria-pressed=true]{color:var(--paper);border-color:rgba(244,184,96,.6);background:rgba(244,184,96,.12)}

  .foot{max-width:420px;text-align:center;font-size:12px;line-height:1.6;color:var(--dim);padding:4px 8px 0}
  .foot p{margin:6px 0}
  .foot .install{color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
    padding:10px 16px;border-radius:20px;background:#2b1c12;border:1px solid rgba(244,184,96,.35);color:var(--paper);font-size:14px;max-width:90vw;text-align:center;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* Landscape: radio on the left, the log on the right. This is the layout a 7 inch Pi screen gets. */
  @media (orientation:landscape) and (min-width:600px){
    .room{grid-template-columns:auto minmax(260px,420px);grid-template-rows:auto auto 1fr;align-items:center;column-gap:28px;min-height:calc(100vh - 32px)}
    .stage{grid-row:1 / span 3}
    .log{text-align:left;align-self:end}
    .log-progress{margin-left:0}
    .log-actions,.faces{justify-content:flex-start}
    .faces{justify-self:start;align-self:start}
    .foot{text-align:left;justify-self:start;align-self:start}
  }
  body.kiosk{cursor:none}
  body.kiosk .foot{display:none}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main class="room">
  <div class="stage" id="stage"><div class="fit" id="fit"></div></div>

  <section class="log" id="log" aria-live="polite">
    <p class="log-status" id="logStatus">Loading the schedule</p>
    <h1 class="log-show" id="logShow">Old Time Radio</h1>
    <p class="log-ep" id="logEp"></p>
    <p class="log-meta" id="logMeta"></p>
    <div class="log-progress" id="logProgress" hidden><div class="log-bar"><i id="logBar"></i></div><span class="log-time" id="logTime"></span></div>
    <p class="log-next" id="logNext"></p>
    <p class="shift" id="logShift" hidden></p>
    <div class="log-actions">
      <button type="button" class="btn" id="playBtn" disabled>Turn on</button>
      <button type="button" class="btn quiet" id="rejoinBtn" hidden>Back to live</button>
    </div>
  </section>

  <nav class="faces" id="faces" aria-label="Choose a radio"></nav>

  <footer class="foot" id="foot">
    <p class="install" id="install" hidden></p>
    <p>Shows stream from the <a href="https://archive.org/details/oldtimeradio" target="_blank" rel="noopener">Internet Archive</a>. Catalog and episode notes by Rob Dawson, <a href="https://oldtime.radio" target="_blank" rel="noopener">oldtime.radio</a>.</p>
    <p><a href="/otr/" target="_blank" rel="noopener">Open the full player</a> &nbsp; <a href="https://archive.org/donate" target="_blank" rel="noopener">Donate to the Internet Archive</a></p>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="auto"></audio>

<script src="/otr/station.js"></script>
<script src="/otr/core/radio-core.js"></script>
<script src="/otr/core/radio-player.js"></script>
<script src="/otr/core/faces.js"></script>
<script>
"use strict";
/* Pop-out player for /otr. Phones, a small desktop window, or a Pi kiosk.
 * URL options: ?face=tabletop|portable  ?kiosk=1 (no footer, no cursor)  ?autoplay=1 (kiosk: switch on at load;
 * launch Chromium with --autoplay-policy=no-user-gesture-required)  ?season=<id>|off  ?ios=1 (iPhone code path). */
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var Q = new URLSearchParams(location.search);
  var KIOSK = Q.get('kiosk') === '1';
  if (KIOSK) document.body.classList.add('kiosk');
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  function fmt(s){ s = Math.max(0, Math.floor(s || 0)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0'); }
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2400); }

  OTRFaces.injectCSS();
  var core = null, player = null, face = null, faceDef = null, scale = 1;

  // ---- fit the face into the space available ----
  function fit(){
    if (!faceDef) return;
    var f = faceDef.size, land = matchMedia('(orientation:landscape) and (min-width:600px)').matches;
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var cs = getComputedStyle(document.body), padV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom), padH = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var availW = land ? Math.min(vw - padH - 300, 640) : Math.min(vw - padH, 460);
    var availH = land ? vh - padV - 8 : Math.max(300, (vh - padV) * (KIOSK ? 0.62 : 0.64));
    scale = Math.max(0.35, Math.min(availW / f.w, availH / f.h, 1.3));
    var fitEl = $('fit'), stage = $('stage');
    fitEl.style.width = f.w + 'px'; fitEl.style.height = f.h + 'px'; fitEl.style.transform = 'scale(' + scale.toFixed(4) + ')';
    stage.style.width = Math.round(f.w * scale) + 'px'; stage.style.height = Math.round(f.h * scale) + 'px';
  }
  // Refit on real size changes only: a phone browser's toolbar sliding in and out changes the height a
  // little on every scroll, and the radio should not breathe while you scroll to the log.
  var lastW = 0, lastH = 0;
  function refit(force){
    var w = document.documentElement.clientWidth, h = window.innerHeight;
    if (!force && w === lastW && Math.abs(h - lastH) < 120) return;
    lastW = w; lastH = h; fit();
  }
  window.addEventListener('resize', function(){ refit(false); });
  window.addEventListener('orientationchange', function(){ setTimeout(function(){ refit(true); }, 250); });
  window.addEventListener('load', function(){ refit(true); });

  // ---- faces ----
  function setFace(id){
    var def = OTRFaces.get(id) || OTRFaces.get(OTRFaces.defaultFor('otr'));
    if (face) face.destroy();
    faceDef = def; save('otrpop_face', def.id);
    face = def.build($('fit'), { player:player, core:core, scale:function(){ return scale; }, toast:toast });
    refit(true); requestAnimationFrame(function(){ refit(true); });
    document.querySelectorAll('#faces button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.id === def.id ? 'true' : 'false'); });
  }
  function buildFaceNav(){
    var nav = $('faces'); nav.innerHTML = '';
    OTRFaces.list('otr').forEach(function(f){
      var b = document.createElement('button'); b.type = 'button'; b.dataset.id = f.id; b.textContent = f.name; b.title = f.blurb;
      b.onclick = function(){ setFace(f.id); }; nav.appendChild(b);
    });
  }

  // ---- the log under the radio ----
  function stationLine(st){
    if (!st) return '';
    return st.name + ', ' + st.freq + ' kc' + (st.seasonal ? ', on the air through ' + st.seasonal.until : '');
  }
  function render(){
    if (!player) return;
    var s = player.state, st = core.station(s.station), res = s.res;
    var near = core.nearest(s.freq), under = near && near.station;
    var status;
    if (s.tuning) status = '<b>' + esc(under ? stationLine(under) : '') + '</b>' + (s.power ? '. Let go to tune in.' : '');
    else if (!s.power) status = esc(stationLine(st)) + '. The radio is off.';
    else status = ({ warming:'Warming up', buffering:'Tuning in', onair:'<span class="air"></span>On the air', paused:'Paused',
      error:'The Internet Archive is not answering. Trying again in 30 seconds.' }[s.status] || '') + (s.status !== 'error' ? ' on <b>' + esc(stationLine(st)) + '</b>' : '');
    setHTML('logStatus', status);
    if (res) {
      setText('logShow', res.show);
      setText('logEp', res.isAd ? 'A vintage advertisement' : res.title);
      var meta = [];
      if (res.slot) meta.push(slotLine(res.slot));
      if (res.date) meta.push('First aired ' + res.date);
      if (!s.power) meta.push('On the air now');
      setText('logMeta', meta.join('. ') + (meta.length ? '.' : ''));
      var nx = (s.next || [])[0], nr = nx && core.resolve(nx);
      setHTML('logNext', nr ? 'Next: <b>' + esc(nr.show) + '</b>' + (nr.title ? ', ' + esc(nr.title) : '') : '');
    }
    var pb = $('playBtn');
    pb.disabled = false;
    pb.textContent = !s.power ? 'Turn on' : (s.status === 'error' ? 'Try again' : (player.audio.paused && s.status !== 'buffering' && s.status !== 'warming') ? 'Play' : 'Pause');
    var shifted = s.power && Math.abs(s.offsetLive) >= 45;
    $('rejoinBtn').hidden = !shifted;
    var sh = $('logShift'); sh.hidden = !shifted;
    if (shifted) sh.textContent = s.offsetLive > 0 ? 'You are ' + fmt(s.offsetLive) + ' behind the broadcast.' : 'You are ' + fmt(-s.offsetLive) + ' ahead of the broadcast.';
    renderProgress();
  }
  // Network items: a real slot reads "Sunday, the 7:00 PM slot"; a stand-in says what it is standing in for.
  function slotLine(sl){
    if (!sl.fill) return sl.day + ', the ' + sl.time + ' slot';
    var lab = String(sl.label || '').replace(/\s*\(fill\)$/i, '');
    if (sl.isDefault || !lab) return sl.day + ' ' + (lab ? lab.toLowerCase() : 'programming') + ' on ' + sl.network;
    return sl.day + ', in place of ' + lab;
  }
  function renderProgress(){
    if (!player || !player.state.item) { $('logProgress').hidden = true; return; }
    var p = player.position();
    $('logProgress').hidden = false;
    $('logBar').style.width = (p.dur ? Math.min(100, 100 * p.t / p.dur) : 0).toFixed(1) + '%';
    $('logTime').textContent = fmt(p.dur - p.t) + ' left';
  }
  function esc(x){ return String(x == null ? '' : x).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function setText(id, t){ var e = $(id); if (e.textContent !== t) e.textContent = t; }
  function setHTML(id, h){ var e = $(id); if (e._h !== h) { e.innerHTML = h; e._h = h; } }

  // ---- buttons and keys ----
  $('playBtn').onclick = function(){
    var s = player.state;
    if (!s.power) player.powerOn();
    else if (s.status === 'error') { s.errCount = 0; player.rejoin(); }
    else if (player.audio.paused && s.status !== 'buffering' && s.status !== 'warming') player.resume();
    else player.pause();
  };
  $('rejoinBtn').onclick = function(){ player.rejoin(); };
  document.addEventListener('keydown', function(e){
    if (!player || e.target.closest('.knob,.pt-wheel,input,textarea')) return;
    if (e.key === ' ') { e.preventDefault(); $('playBtn').click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); player.step(+1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); player.step(-1); }
  });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && player) { player.tick(); render(); } });

  // ---- installing to the home screen ----
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (!standalone && !KIOSK) {
    var inst = $('install');
    if (OTRPlayer.isIOS) { inst.textContent = 'To keep this on your Home Screen, tap Share, then Add to Home Screen.'; inst.hidden = false; }
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault(); var ev = e;
      inst.innerHTML = ''; var b = document.createElement('button'); b.type = 'button'; b.className = 'btn quiet'; b.textContent = 'Add to Home Screen';
      b.onclick = function(){ ev.prompt(); ev.userChoice.finally(function(){ inst.hidden = true; }); };
      inst.appendChild(b); inst.hidden = false;
    });
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});

  // ---- start ----
  OTRCore.load({ season:Q.get('season') }).then(function(c){
    core = c;
    player = new OTRPlayer.Player(core, { audio:$('audio'), artwork:'/otr/pop/icon-512.png' });
    player.on('change', render);
    player.on('tick', renderProgress);
    player.on('tick', function(){ if (!player.state.power) render(); });
    player.on('freq', function(){ if (player.state.tuning) render(); });
    player.on('notice', toast);
    buildFaceNav();
    setFace(Q.get('face') || load('otrpop_face', OTRFaces.defaultFor('otr')));
    var tune = Q.get('tune');                              // handed over by "pop out radio" on the full player
    player.tuneTo(tune && core.station(tune) ? tune : player.state.station);
    render();
    if ((KIOSK && Q.get('autoplay') === '1') || (tune && Q.get('on') === '1')) player.powerOn();
    if (tune && history.replaceState) {                   // a reload should not tune and switch on again
      var q2 = new URLSearchParams(location.search); q2.delete('tune'); q2.delete('on');
      history.replaceState(null, '', location.pathname + (String(q2) ? '?' + q2 : ''));
    }

    // One radio at a time: this page and the full player (or another pop-out) pause each other.
    if (window.BroadcastChannel) {
      var bc = new BroadcastChannel('otr-radio'), me = 'pop-' + Math.random().toString(36).slice(2);
      player.audio.addEventListener('playing', function(){ bc.postMessage({ type:'playing', from:me }); });
      bc.onmessage = function(e){ var d = e.data || {}; if (d.type === 'playing' && d.from !== me && player.state.power && !player.audio.paused) player.pause(); };
    }
  }).catch(function(e){
    console.error(e);
    setHTML('logStatus', 'The schedule did not load. Check the connection and reload.');
    setText('logShow', 'Old Time Radio');
  });

  window.__pop = {
    ready:function(){ return !!(player && face); },
    core:function(){ return core; }, player:function(){ return player; },
    face:function(){ return faceDef && faceDef.id; }, setFace:setFace, scale:function(){ return scale; }
  };
})();
</script>
<script src="/lib/stat.js"></script>
</body>
</html>
