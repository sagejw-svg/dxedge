<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Late Night replay — Old Time Radio</title>
<meta name="description" content="Watch the finished Late Night science-fiction program later. Chapters and credits are here. The video plays only after the finished file is hosted, and it does not start by itself.">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #080808; --bg1: #101010; --bg2: #171717; --border: #2a2a2a;
    --text: #e8e8e8; --muted: #a6a6a6; --dim: #7c7c7c;
    --amber: #ffb347; --amber2: #ffd08a; --green: #00ff9d;
    --font: "SF Mono", "Fira Code", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: var(--font); font-size: 14px; line-height: 1.5;
    padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  a { color: var(--green); }
  a:hover { color: #fff; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  main { max-width: 880px; margin: 0 auto; }
  .ln-kicker { margin: 14px 0 0; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); }
  h1 { margin: 4px 0 0; font-size: 22px; font-weight: 600; letter-spacing: 0.3px; color: #fff; }
  h1 span { color: var(--amber); }
  h2 { margin: 22px 0 8px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .ln-station, .ln-run, .ln-note { color: var(--muted); margin: 6px 0 0; }
  .ln-run b { color: var(--amber2); font-weight: 600; }
  #lnStage { margin-top: 16px; }
  #lnPending[hidden], video[hidden] { display: none !important; }
  #lnStill, video {
    display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 16 / 9;
    object-fit: cover; background: #000; border-radius: 12px; border: 1px solid var(--border);
  }
  video { object-fit: contain; background: #000; }
  #lnStatus {
    margin: 12px 0 0; color: var(--amber2); min-height: 1.4em;
  }
  .ln-hint { margin: 6px 0 0; color: var(--dim); font-size: 12px; }
  #lnChapters { display: flex; flex-direction: column; gap: 6px; }
  #lnChapters button {
    display: grid; grid-template-columns: 5.6em minmax(0, 1fr); gap: 2px 10px;
    width: 100%; min-height: 44px; padding: 8px 10px; text-align: left;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg1); color: var(--text);
    font: inherit; cursor: pointer;
  }
  #lnChapters button:hover { border-color: var(--amber); }
  #lnChapters button[aria-current="true"] { border-color: var(--amber); background: #1a140c; }
  #lnChapters .ln-clock { color: var(--amber2); font-variant-numeric: tabular-nums; }
  #lnChapters .ln-label { overflow-wrap: anywhere; }
  #lnChapters .ln-detail { grid-column: 2; color: var(--dim); font-size: 12px; }
  #lnChapters button.ep .ln-label { color: #fff; }
  #lnCredits { color: var(--muted); font-size: 13px; }
  #lnCredits ul { margin: 8px 0 0; padding: 0; list-style: none; }
  #lnCredits li { margin: 6px 0; overflow-wrap: anywhere; }
  @media (max-width: 420px) {
    h1 { font-size: 20px; }
    #lnChapters button { grid-template-columns: minmax(0, 1fr); }
    #lnChapters .ln-detail { grid-column: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="lnApp">
  <p class="ln-back"><a href="/otr/">Back to the radio</a></p>
  <p class="ln-kicker">Watch later</p>
  <h1>Late Night <span>replay</span></h1>
  <p class="ln-station" id="lnStation"></p>
  <p class="ln-run" id="lnRun"></p>
  <div id="lnStage">
    <div id="lnPending">
      <img id="lnStill" alt="" src="/otr/scenes/space.jpg" width="1280" height="720">
    </div>
    <video id="lnVideo" controls playsinline preload="none" hidden></video>
  </div>
  <p id="lnStatus" role="status">Checking whether the replay is on the server.</p>
  <p class="ln-hint" id="lnHint">This page is the finished program, separate from the live broadcast.</p>
  <h2>Chapters</h2>
  <nav id="lnChapters" aria-label="Chapters"></nav>
  <h2>Credits</h2>
  <section id="lnCredits" aria-label="Credits"></section>
</main>
<script src="latenight.js?v=2"></script>
</body>
</html>
